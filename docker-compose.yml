name: better-lifting-app

# Local SQL Server, running as a background daemon.
#
#   docker compose up -d      start it (once — it then autostarts on every boot)
#   docker compose ps         check it
#   docker compose down       stop it (omit -v to keep your data)
#
# `restart: unless-stopped` + docker.service being enabled at boot makes this
# behave like the SQL Server Express Windows service: always up, survives reboots,
# but respects an explicit `docker compose stop`.
#
# The server and client run natively (`dotnet run`, `npx expo start`) and reach
# this at localhost:1433 — which is what appsettings.json already points to.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: liftingapp-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-LiftingApp!Dev2026}"
      # Express caps memory at ~1.4GB; Developer edition is considerably hungrier
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      # Named volume, so `docker compose down` / image upgrades don't wipe the database
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
