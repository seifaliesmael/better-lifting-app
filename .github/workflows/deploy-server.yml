name: Deploy API to Azure

on:
  push:
    branches: [production]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch: # for deploying from sidebar

env:
  AZURE_WEBAPP_NAME: mesopal-server
  PROJECT_PATH: server/BetterLiftingApp/BetterLiftingApp.csproj
  AZURE_RESOURCE_GROUP: MesopalResources
  AZURE_SQL_SERVER: mesopal
  EF_TOOLS_VERSION: '10.0.9' 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --output ./publish

      - name: Install EF Core tools
        run: |
          dotnet tool install --global dotnet-ef --version ${{ env.EF_TOOLS_VERSION }}
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Open SQL firewall for this runner
        id: sql_firewall
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"
          az sql server firewall-rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER" \
            --name "gh-actions-${{ github.run_id }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      - name: Apply EF Core migrations
        env:
          ConnectionStrings__DbConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: dotnet ef database update --project ${{ env.PROJECT_PATH }} --configuration Release

      - name: Close SQL firewall
        if: always() && steps.sql_firewall.outcome == 'success'
        run: |
          az sql server firewall-rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server "$AZURE_SQL_SERVER" \
            --name "gh-actions-${{ github.run_id }}"
      # -------------------------------------------------------------------------

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
